name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml jsonschema pytest
      - run: python -m scripts.full_check
      - run: python -m scripts.verify_external_links --respect-cache --report
