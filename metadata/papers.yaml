    fluxes are critical for our understanding of the global carbon cycle and climate
    change. Reducing the uncertainty of the terrestrial carbon sink and closing the
    budget imbalance between sources and sinks would improve our ability to accurately
    project future climate change. Net Ecosystem Exchange (NEE), the net flux of biogenic
    carbon from the land surface to the atmosphere, is only directly measured at a
    sparse set of globally distributed eddy-covariance measurement sites. To estimate
    the terrestrial carbon flux at the regional and global scale, a global gridded
    estimate of NEE must be accurately upscaled from a model trained at the ecosystem
    level. In this study, the Fluxcom system* is used to train a site-level model
    on remotely-sensed and meteorological variables derived from site measurements,
