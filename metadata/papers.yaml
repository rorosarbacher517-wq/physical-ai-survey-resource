  abstract: Gross Primary Productivity (GPP) in grassland ecosystems is a fundamental
    eco-biophysical indicator for assessing carbon cycling, grazing capacity, and
    ecosystem responses to climatic stress. However, robust estimation of GPP in arid
    and semi-arid rangelands remains challenging because of pronounced spatial heterogeneity,
    strong climate variability, and inherent uncertainties associated with remotely
    sensed observations. Together, these factors constrain both modeling performance
    and out-of-sample generalization beyond the training domain. In this dryland grassland
    context, this study compares the performance of machine learning (ML) models for
    grassland GPP proxy-based characterization, downscaling, and predictive agreement
    using a multivariate dataset that integrates Sentinel-2-derived spectral and phenological
    features, a Moderate-Resolution Imaging Spectroradiometer (MODIS)-derived GPP
