    the urban business and residential communities. In the temporal domain, the building
    foundation settlement often suffers from high level dynamics and needs real-time
    monitoring. Accurate quantification of the uncertainty of foundation settlement
    in the near future is essential for the in-advance risk management for buildings.
    Traditional models for predicting foundation settlement mostly utilizing the point
