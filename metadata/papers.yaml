    carbon cycle by integrating ecological processes across scales, yet they introduce
    significant uncertainties in climate and biogeochemical projections due to diverse
    process representations and parameter variations. For instance, different soil
    water limitation functions lead to wide productivity ranges across models. To
    address this, we propose the Differentiable Land Model (DifferLand), a novel hybrid
    machine learning approach replacing unknown water limitation functions in models
