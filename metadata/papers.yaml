  abstract: 'Environmental monitoring using satellite remote sensing is challenging
    because of data gaps in eddy-covariance (EC)-based in situ flux tower observations.
    In this study, we obtain the latent heat flux (LE) from an EC station and perform
    gap filling using two deep learning methods (two-dimensional convolutional neural
    network (CNN) and long short-term memory (LSTM) neural networks) and two machine
    learning (ML) models (support vector machine (SVM), and random forest (RF)), and
    we investigate their accuracies and uncertainties. The average model performance
    based on ~25 input and hysteresis combinations show that the mean absolute error
    is in an acceptable range (34.9 to 38.5 Wm−2), which indicates a marginal difference
    among the performances of the four models. In fact, the model performance is ranked
    in the following order: SVM > CNN > RF > LSTM. We conduct a robust analysis of
    variance and post-hoc tests, which yielded statistically insignificant results
    (p-value ranging from 0.28 to 0.76). This indicates that the distribution of means
    is equal within groups and among pairs, thereby implying similar performances
    among the four models. The time-series analysis and Taylor diagram in'
