    increasingly critical for rapid disaster response and humanitarian relief operations.
    However, current state-of-the-art deep learning models exhibit significant generalization
    challenges when deployed to geographically and environmentally diverse regions.
    This study investigates the nature and extent of geographic bias in building damage
    detection systems, revealing that model performance degradation occurs primarily
    from geographic and structural characteristics rather than insufficient training
