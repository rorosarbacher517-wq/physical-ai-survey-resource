  abstract: Abstract The good choice of hyperparameters is crucial for the successful
    application of Deep Learning (DL) networks in order to find accurate solutions
    or the best parameter in solving Partial Differential Equations (PDEs), that are
    sensitive to errors in coefficient estimation. For this purpose, Hyperparameter
    Optimization of Multi-Output Physics-Informed Neural Networks (HOMO-PINNs) is
    based on the optimal search of PINN hyperparameters for solving PDEs with uncertain
    coefficients in the Uncertainty Quantification (UQ) field. By testing this novel
    methodology on different PDEs, the relationship between activation functions,
    the number of output neurons, and the degree of coefficient uncertainty can be
    observed. The experimental results show that adding output neurons to the Neural
    Network (NN) even if a theoretically incorrect activation function is chosen,
    keeps the predicted solution accurate.
