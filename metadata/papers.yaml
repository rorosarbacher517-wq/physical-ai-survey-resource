  abstract: Under the Paris Agreement, countries are encouraged to preserve and enhance
    existing carbon sinks. Europe, in particular, has committed to achieving climate
    neutrality - attaining a balance between anthropogenic emissions from sources
    and removals by sinks - by 2050. Achieving these ambitious goals requires accurate
    and credible estimation of CO2 fluxes. However, discrepancies between observations
    and global models hinder the tracking of collective progress towards climate neutrality.
    Efforts to improve transparency and data comparability are crucial to better align
    national mitigation strategies with global pathways. In particular, effective
