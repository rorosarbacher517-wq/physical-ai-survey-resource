  abstract: Abstract. The land carbon cycle can act as both a negative and positive
    climate feedback. Currently, it serves as a negative feedback, absorbing about
    one-third of anthropogenic CO2 emissions. However, multi-model studies project
    a weakening of this sink, with the potential for a future shift to a carbon source.
    Significant inter-model differences persist, limiting confidence in these projections.
    Some of these discrepancies may arise from parameter uncertainty. Advances in
    artificial intelligence, computing, and Earth observations now offer new opportunities
    to better constrain key model parameters. While previous studies have shown that
    parameter optimization can substantially improve model performance, they have
    not explored its impact on the future carbon balance. To address this gap, I use
    a machine learning algorithm to optimize 28 model parameters based on 13 global
