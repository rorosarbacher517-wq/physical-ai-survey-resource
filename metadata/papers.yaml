  abstract: Estimating net ecosystem exchange (NEE) in agricultural ecosystems is
    essential for quantifying carbon fluxes and supporting carbon neutrality strategies.
    However, satellite-based NEE products developed at coarse spatial resolutions
    often exhibit limited applicability to fragmented agricultural landscapes, where
    mixed-pixel effects and scale mismatch obscure field-scale carbon exchange signals.
    This limitation is particularly pronounced in South Korea, where rice paddies
    are widely distributed within complex terrain and exhibit strong seasonal variability
    driven by intensive management practices. In this study, we developed a high-resolution,
    grid-based NEE estimation framework for rice paddy areas in South Korea with a
    daily temporal resolution and a spatial resolution of 500 m. The proposed approach
    integrates satellite-derived MODIS vegetation indices—normalized difference vegetation
    index (NDVI), fraction of photosynthetically active radiation (FPAR), and leaf
