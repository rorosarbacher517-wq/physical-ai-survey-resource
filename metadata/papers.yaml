    through respiration in autotrophs and heterotrophs. Continuously measured values
    of carbon fluxes of a forest ecosystem, particularly net ecosystem exchange (NEE)
    could be used as a general indicator of forest ecosystem functioning. Subsequently,
    quantification of the ecosystem functioning as a response to changes in the microclimate
    and environmental variables is necessary to frame sustainable adaptive measures
    and conservation policies. The Himalayan Chir- Pine (Pinus roxburghii Sarg.) is
    a gregarious, fire-resistant, indigenous tree species, often form pure forests
