  abstract: '&amp;lt;p&amp;gt;Monitoring CO&amp;lt;sub&amp;gt;2&amp;lt;/sub&amp;gt;
    emissions originating from urban areas has become a necessity to support sustainable
    urban planning strategies and climate change mitigation efforts. Integrative decision
    support, where net effects of various emission/sink components are considered
    and compared, is now an increasingly relevant part of urban planning processes.
    The current emission inventories rely on indirect approaches that use fuel and
    electricity consumption statistics for determining CO&amp;lt;sub&amp;gt;2&amp;lt;/sub&amp;gt;
    emissions. The consistency of such approaches is questionable and they usually
    neglect the contribution of the biogenic components of the urban carbon cycle
    (i.e. vegetation, soil). Moreover, their spatial and temporal scales are restricted
    because consumption statistics are often available in coarse spatial scales (national,
