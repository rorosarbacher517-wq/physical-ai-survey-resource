    ecosystems, indicating the value of net ecosystem exchange (NEE) between terrestrial
    ecosystems and the atmosphere, excluding carbon fluxes from disturbances. Leveraging
    flux network NEE annual measurements, this study focuses on upscaling the tower-based
    NEP to a global 250 m resolution dataset with flux site distribution considerations.
    Firstly, the data augmentation method was presented to address issues related
    to the uneven spatial distribution of flux sites. Secondly, a random forest model
    was developed for NEP estimation using the optimized tower-based NEP and remotely
    sensed and meteorological gridded sample sets, giving an R2 value of 0.73 and
    an RMSE value of 149.83 gC m−2 yr−1. Finally, a global NEP product at a 250 m
