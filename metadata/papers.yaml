  abstract: Abstract Vegetation plays a key role in regulating the material and energy
    exchanges among the biosphere, the atmosphere, and the pedosphere. Modeling and
    predicting vegetation key variables such as leaf area index (LAI) and gross primary
    productivity (GPP) are crucial to understand and project the processes of vegetation
    growth in response to climate change. While a number of studies developed models
    to simulate vegetation GPP using satellite‐derived LAI, the requirement of satellite‐based
    model inputs largely limits the predicting power of these developed models. This
    study developed a machine learning scheme, utilizing both support vector regression
    (SVR) and random forests (RF), which are capable of modeling LAI and GPP time
    series using only meteorological variables. We first simulated the LAI time series
    directly using meteorological variables as inputs and then buffered its unrealistic
    day‐to‐day fluctuation, and further modeled the GPP time series using meteorological
