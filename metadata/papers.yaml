  abstract: Large-scale hydrodynamic models generally rely on fixed-resolution spatial
    grids and model parameters as well as incurring a high computational cost. This
    limits their ability to accurately forecast flood crests and issue time-critical
    hazard warnings. In this work, we build a fast, stable, accurate, resolution-invariant,
    and geometry-adaptative flood modeling and forecasting framework that can perform
    at scales from continental to global. We achieve this by combining continuous
    flow modeling of a geometry-adaptive physics-informed neural solver (GeoPINS)
    with the authenticity of Earth observation data. Specifically, the GeoPINS is
    proposed based on the advantages of no training data in physics-informed neural
    networks (PINNs), as well as possessing a fast, accurate, and resolution-invariant
    architecture through the implementation of Fourier neural operators (FNO). In
    particular, to adapt to complex and irregular geometries that exist in rivers,
