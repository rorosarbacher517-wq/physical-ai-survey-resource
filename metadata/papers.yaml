  abstract: '&amp;lt;p&amp;gt;Quantifying forecast uncertainty is a key aspect of
    state-of-the-art data assimilation systems which has a large impact on the quality
    of the analysis and then the following forecast. In recent years, most operational
    data assimilation systems incorporate state-dependent uncertainty quantification
    approaches based on 4-dimensional variational approaches, ensemble-based approaches,
    or their combination. However, these quantifications of state-dependent uncertainties
    have a large computational cost. Machine learning techniques consist of trainable
    statistical models that can represent complex functional dependencies among different
    groups of variables. In this work, we use a fully connected two hidden layer neural
    network for the state-dependent quantification of forecast uncertainty in the
    context of data assimilation. The input to the network is a set of three consecutive
    forecasted states centered at the desired lead time and the network&amp;amp;#8217;s
