  abstract: 'We introduce EarthPT -- an Earth Observation (EO) pretrained transformer.
    EarthPT is a 700 million parameter decoding transformer foundation model trained
    in an autoregressive self-supervised manner and developed specifically with EO
    use-cases in mind. We demonstrate that EarthPT is an effective forecaster that
    can accurately predict future pixel-level surface reflectances across the 400-2300
    nm range well into the future. For example, forecasts of the evolution of the
    Normalised Difference Vegetation Index (NDVI) have a typical error of approximately
    0.05 (over a natural range of -1 -> 1) at the pixel level over a five month test
    set horizon, out-performing simple phase-folded models based on historical averaging.
    We also demonstrate that embeddings learnt by EarthPT hold semantically meaningful
    information and could be exploited for downstream tasks such as highly granular,
    dynamic land use classification. Excitingly, we note that the abundance of EO
