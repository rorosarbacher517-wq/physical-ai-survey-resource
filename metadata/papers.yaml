    of all the world's forests combined, acting as crucial carbon sinks. However,
    under varying environmental conditions induced by global warming and land cover
    changes, they can transition into carbon sources. Monitoring gas exchanges in
    peatland ecosystems involves employing the eddy covariance method, often interpreted
    using flux footprint models. This study focuses on the application of the FFP
