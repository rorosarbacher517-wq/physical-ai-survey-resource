    of measured fluxes is critical for interpreting eddy covariance (EC) data accurately.
    To address this, footprint models are used to simulate the transport of turbulence
    and quantify the contribution of different areas within the source region. These
    models rely on theoretical assumptions, such as homogeneous and stationary atmospheric
    conditions, which often deviate significantly from real-world conditions particularly
