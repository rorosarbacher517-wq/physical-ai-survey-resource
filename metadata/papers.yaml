  abstract: Eddy covariance observation is an applicable way to obtain accurate and
    continuous carbon flux at flux tower sites, while remote sensing technology could
    estimate carbon exchange and carbon storage at regional and global scales effectively.
    However, it is still challenging to up-scale the field-observed carbon flux to
    a regional scale, due to the heterogeneity and the unstable air conditions at
    the land surface. In this paper, gross primary production (GPP) from ground eddy
    covariance systems were up-scaled to a regional scale by using five machine learning
    methods (Cubist regression tree, random forest, support vector machine, artificial
    neural network, and deep belief network). Then, the up-scaled GPP were validated
    using GPP at flux tower sites, weighted GPP in the footprint, and MODIS GPP products.
    At last, the sensitivity of the input data (normalized difference vegetation index,
    fractional vegetation cover, shortwave radiation, relative humidity and air temperature)
