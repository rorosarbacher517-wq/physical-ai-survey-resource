  abstract: 'The eddy covariance (EC) method is the standard technique for determining
    forest ecosystem-atmosphere turbulent exchange, however, it encounters a significant
    challenge: the air masses below the canopy often become decoupled from the air
    masses above it. Consequently, the EC measurements of scalar fluxes (e.g. H2O
    and particularly CO2) above the canopy can be biased due to missing signals from
    below-canopy processes. This decoupling is strongly site dependent and influenced
    by atmospheric conditions, canopy properties and tower-surrounding topography.
    Multiple approaches have been developed in the recent decades to address decoupling
    (e.g. u* filtering, quality flags for flux measurements, storage change evaluations,
    direct advection measurements), however, all of them appeared to be insufficient
    to fully tackle the problem. A promising additional approach is based on subsequent
    EC measurements below and above the canopy. Specifically, examining the correlation
    of the standard deviation of vertical wind (obtained via sonic anemometers) below
    and above the canopy provides insight into the coupling state, as this correlation
