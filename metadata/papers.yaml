  abstract: In this work, I implement a Physics-Informed Neural Network (PINN) to
    solve the 1D Burgers' equation. I begin with a simple feed-forward neural network
    (FFNN), which is trained using the finite-difference solution of the Burgers'
    equation. I then extend this FFNN into a PINN that learns the governing equation
    directly by minimizing the residuals of the PDE. I perform parametric evaluations
    for both the FFNN and PINN models and compare their computational performance.
    To improve results for simulations with long run times, where the standard PINN
    struggles, I introduce and apply a Time-Marched PINN approach. Finally, I assess
    the effectiveness of the method and suggest a few possible directions for improvement.
    This write-up serves as a practical companion for those beginning their journey
    with PINNs, particularly readers interested in computational trade-offs, training
    challenges, and implementation strategies using simple 1D PDEs like the Burgers'
    equation.
