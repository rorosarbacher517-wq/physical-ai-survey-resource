  abstract: Global Navigation Satellite System Reflectometry (GNSS-R) provides all-weather,
    high-resolution ocean wind speed monitoring that offers additional benefits for
    forecasting tropical cyclones and severe weather events. However, existing GNSS-R
    wind retrieval models often lack interpretability and suffer accuracy degradation
    during high wind conditions. To address these limitations, we leverage a mathematical
    equivalence between Transformers and graph neural networks (GNNs) on complete
    graphs, which provides a physically grounded interpretation of self-attention
    as spatiotemporal influence propagation in GNSS-R data. In our model, each GNSS-R
    footprint is treated as a graph node whose multi-head self-attention weights quantify
    localized interactions across space and time. This aligns physical influence propagation
    with the computational efficiency of GPU-accelerated Transformers. Multi-head
    attention disentangles processes at multiple scales—capturing local (25–100 km),
    mesoscale (100 km–500 km), and synoptic (>500 km) circulation patterns. When applied
