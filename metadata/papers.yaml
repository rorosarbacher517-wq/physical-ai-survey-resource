  abstract: 'In this study, we generate a global, long-term, hourly terrestrial water-energy-carbon
    fluxes, using model simulations, in-situ measurements, and physics-informed machine
    learning. The soil-plant model, STEMMUS-SCOPE was deployed to simulate land surface
    fluxes over 170 Fluxnet sites (STEMMUS &amp;#8211; Simultaneous Transfer of Energy,
    Mass, and Momentum in Unsaturated Soil; SCOPE - Soil Canopy Observation, Photochemistry
    and Energy fluxes radiative transfer model). The model input and output data were
    then used as training data-pairs to develop the STEMMUS-SCOPE emulator using multivariate
    random forests regression algorithm. Here, physics-informed machine learning refers
    to the fact that the emulator was trained and constrained by the physical consistency
    represented by the soil-plant model. We compared the physics-informed emulator
    (RF_S-S) with the one trained using only Fluxnet in-situ measurements (RF_in-situ),
