taxonomy_version: 1.0.0
branches:
- id: physics-informed-scientific-ai
  label: Physics-informed scientific AI
  definition: AI systems that incorporate scientific priors, equations, constraints,
    operators, simulators, or physical evaluation.
  parent: null
  aliases:
  - scientific machine learning
  - physics-informed AI
  inclusion_rules:
  - Scientific or engineering system is explicit.
  exclusion_rules:
  - Embodied interaction without scientific-modeling content belongs under embodied
    physical intelligence.
  examples:
  - PINNs
  - neural operators
- id: embodied-physical-intelligence
  label: Embodied physical intelligence
  definition: AI systems that perceive, reason, plan, and act in the physical world.
  parent: null
  aliases:
  - embodied AI
  - physical intelligence
  inclusion_rules:
  - Physical perception, control, robot learning, or VLA behavior is central.
  exclusion_rules:
  - Pure scientific surrogate modelling belongs in physics-informed scientific AI.
  examples:
  - robot learning
  - vision-language-action models
